<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>파워리프팅 4주 사이클 트래커</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  html, body { margin:0; padding:0; background:#141519; }
  #root { min-height:100vh; }

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* ───────── Firebase (기기 간 동기화) ───────── */
const firebaseConfig = {
  apiKey: "AIzaSyDgrV_uAxNq-RSwzlWPVjoABh8teG1VjO8",
  authDomain: "powerlifting-dc801.firebaseapp.com",
  projectId: "powerlifting-dc801",
  storageBucket: "powerlifting-dc801.firebasestorage.app",
  messagingSenderId: "236514787587",
  appId: "1:236514787587:web:ca0111bc685ef33b622936",
  measurementId: "G-ELEYW5C71S",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("powerlifting").doc("main");

/* ───────── 계산 유틸 ───────── */
const r25 = (x) => Math.ceil((x - 1.25 - 1e-9) / 2.5) * 2.5; // 2.5kg 반올림(경계 내림)
const KG2LB = 2.2046226218;
const KG25_IN_LB = Math.round(2.5 * KG2LB); // 2.5kg ≈ 6lb (10/25/45lb만 있어 5lb 불가, 마이크로 kg원판으로 보충)
const r5 = (x) => Math.round(x / 5) * 5; // 5lb 반올림
const toDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const e1rm = (w, reps, rpe) => {
  if (!w || !reps) return null;
  const rr = rpe === "" || rpe == null ? 10 : Number(rpe);
  return Math.round(w * (1 + (Number(reps) + (10 - rr)) / 30) * 10) / 10;
};
const fmt = (x) => (x == null || isNaN(x) ? "—" : Number(x) % 1 === 0 ? String(x) : x.toFixed(1));
// 표시 전용 라벨 — 저장 키·로그 lift 식별자("중딥")는 기존 데이터 호환을 위해 그대로 유지
const liftLabel = (name) => (typeof name === "string" ? name.replace("중딥", "중량딥스") : name);
// 계획된 목표 kg이 있어(자동 기록 가능) "무조건 무게 기입"이 필요 없는 항목인지 판별
const hasWeightInput = (it) => !!it.detail && it.detail.some((d) => typeof d.kg === "number");
const withCount = (rep) => {
  if (typeof rep !== "string") return rep;
  if (rep.includes("초")) return rep;
  const m = rep.match(/^(\d+(?:~\d+)?\+?)/);
  if (!m) return rep;
  return rep.slice(0, m[0].length) + "회" + rep.slice(m[0].length);
};

/* ───────── 기본 데이터 ───────── */
const DEFAULT_SETTINGS = {
  startDate: "2026-07-06",
  bodyweight: 67.5,
  compDate: "2026-12-12", // 대회일(가장 이른 후보로 보수적 설정)
  lifts: {
    스쿼트: { w: 142.5, reps: 2, rpe: 9, manual: 140, inc: 5 },
    벤치: { w: 80, reps: 12, rpe: 9, manual: 106.5, inc: 2.5 },
    데드: { w: 185, reps: 1, rpe: 9, manual: 175, inc: 5 },
    중딥: { weight: 90, unit: "lb", inc: 2.5 }, // weight=현재 작업무게(lb), inc=예측 탭 전용 추정치
    "중량 풀업": { weight: 20, unit: "kg", inc: 1.25 }, // weight=현재 작업무게(kg), inc=예측 탭 전용 추정치
  },
};

const SEED_LOGS = [
  { id: 1, cyc: "0", wk: "-", lift: "스쿼트", w: 142.5, reps: 2, rpe: 9, memo: "전환주 테스트" },
  { id: 2, cyc: "0", wk: "1주", lift: "벤치", w: 80, reps: 12, rpe: 9, memo: "통과 +1렙, TM 검증" },
  { id: 3, cyc: "0", wk: "-", lift: "중딥", w: 41, reps: 3, rpe: 8.5, memo: "90lbs 3×3 탑" },
  { id: 4, cyc: "0", wk: "-", lift: "중량 풀업", w: 17.5, reps: 3, rpe: 8, memo: "탑 테스트, 백오프 10×8×3" },
  { id: 5, cyc: "0", wk: "1주", lift: "데드", w: 130, reps: 8, rpe: 8.5, memo: "캡 준수, 하단 약점 체감" },
  { id: 6, cyc: "1", wk: "2주", lift: "스쿼트", w: 115, reps: 8, rpe: 8, memo: "바 스피드 여유 큼 (실질 RPE 6~7 추정)" },
  { id: 7, cyc: "1", wk: "2주", lift: "벤치", w: 87.5, reps: 8, rpe: "", memo: "첫 시도 5회 후 재시도 성공" },
  { id: 8, cyc: "1", wk: "2주", lift: "데드", w: 145, reps: 6, rpe: 8.75, memo: "캡6 도달, 하단 약점" },
  { id: 9, cyc: "1", wk: "2주", lift: "중딥", w: 41, reps: 3, rpe: "", memo: "90lbs 탑 + 백오프 45lbs 3×8" },
];

const GOALS = { 스쿼트: 175, 벤치: 117.5, 데드: 212.5, 중딥: 100, "중량 풀업": 60 };
const MAIN_LIFTS = ["스쿼트", "벤치", "데드"];

/* ───────── RPE+렙 이중 웨이브 (2026-07-29 개편, AMRAP·TM 폐지) ───────── */
// 종목별 렙 상한(작업 세트만) — 초과 시 상한으로 캡하고 같은 RPE로 %e1RM 재계산
const REP_CAP = { 스쿼트: 8, 벤치: 6, 데드: 4 };
// e1RM 공식의 역산: 주어진 렙·RPE에서 %e1RM (e1rm = w*(1+(reps+(10-rpe))/30) 의 역함수)
const pctOfE1rm = (rep, rpe) => 30 / (40 + rep - rpe);
const capRep = (lift, rep) => Math.min(rep, REP_CAP[lift] ?? rep);
// 메인(앵커) 웨이브 — 스쿼트·벤치·데드 공통, 렙 상한만 종목별로 캡
const MAIN_WAVE = { 1: { rpe: 7, rep: 5 }, 2: { rpe: 8, rep: 3 }, 3: { rpe: 9, rep: 1 }, 4: { rpe: 6, rep: 3 } };
// 변형 웨이브 — 볼륨스쿼트·라슨벤치·템포벤치·정지데드·클로즈그립벤치 공통, 렙 상한만 종목별로 캡
const VAR_WAVE = { 1: { rpe: 9, rep: 3 }, 2: { rpe: 8, rep: 5 }, 3: { rpe: 6, rep: 8 }, 4: { rpe: 5, rep: 5 } };
const waveSet = (table, lift, w, e1) => {
  const { rpe } = table[w];
  const rep = capRep(lift, table[w].rep);
  const p = pctOfE1rm(rep, rpe);
  return { rpe, rep, pctLabel: `${(p * 100).toFixed(1)}%`, kg: e1 != null ? r25(e1 * p) : null };
};
const mainSet = (lift, w, e1) => waveSet(MAIN_WAVE, lift, w, e1);
const varSet = (lift, w, e1) => waveSet(VAR_WAVE, lift, w, e1);

// 3대 e1RM — 3주차 "진짜 싱글" 실측 로그가 사이클 간 기준점 갱신(계획보다 여유 있으면 위로, 딱 맞으면 자연 유지) · manual 입력 시 그 값 우선
const currentE1rm = (lift, S, logs, cycle) => {
  const v = S.lifts[lift];
  if (v.manual !== "" && v.manual != null) return Number(v.manual);
  for (let c = cycle - 1; c >= 1; c--) {
    const log = logs.find((l) => l.lift === lift && l.wk === "3주" && String(l.cyc) === String(c) && l.setIdx === 0);
    if (log) return e1rm(log.w, log.reps, log.rpe);
  }
  return e1rm(Number(v.w), Number(v.reps), v.rpe === "" ? "" : Number(v.rpe));
};

// 중딥·중량풀업 4×5 스트레이트 — 마지막(4번째) 세트 RPE로 다음 세션 무게 증량폭 판정
const progressionInc = (rpe, unit) => {
  if (rpe === "" || rpe == null) return 0;
  const r = Number(rpe);
  if (r <= 6.5) return unit === "lb" ? 10 : 5;
  if (r <= 7.5) return unit === "lb" ? 5 : 2.5;
  if (r <= 8) return unit === "lb" ? 2.5 : 1.25;
  return 0; // 8.5~9 유지 / 9.5+ 유지+재판단(플래그는 UI에서 별도 표시)
};
// 저장된 작업무게 없으면 구 TM 체계에서 1회 이관(라이브 사용자 기존 진행치 보존)
const legacyWorkingWeight = (v, unit) => {
  if (v.weight != null && v.weight !== "") return Number(v.weight);
  if (v.w == null) return null;
  const e = e1rm(Number(v.w), Number(v.reps), v.rpe === "" ? "" : Number(v.rpe));
  const legacyApplied = v.manual !== "" && v.manual != null ? Number(v.manual) : e ? Math.round(e * 0.9 * 10) / 10 : null;
  if (legacyApplied == null) return null;
  return unit === "lb" ? r5(legacyApplied * 0.95 * KG2LB) : r25(legacyApplied * 0.95);
};
const PLATE = {
  1: { c: "#C9463D", label: "볼륨" }, // 25kg 빨강
  2: { c: "#3B6FB5", label: "브릿지" }, // 20kg 파랑
  3: { c: "#D8A62A", label: "고강도" }, // 15kg 노랑
  4: { c: "#6E7480", label: "디로드" }, // 회색
};

/* ───────── 메인 ───────── */
function App() {
  const [tab, setTab] = useState("today");
  const [S, setS] = useState(DEFAULT_SETTINGS);
  const [logs, setLogs] = useState(SEED_LOGS);
  const [ready, setReady] = useState(false);
  const [viewWeek, setViewWeek] = useState(null);

  useEffect(() => {
    // 로컬 캐시 먼저 표시(오프라인 대비) → 이후 Firestore 실시간 값으로 덮어씀
    try {
      const s = localStorage.getItem("pl:settings");
      if (s) setS(JSON.parse(s));
    } catch (e) {}
    try {
      const l = localStorage.getItem("pl:logs");
      if (l) setLogs(JSON.parse(l));
    } catch (e) {}

    const unsub = docRef.onSnapshot(
      (snap) => {
        const data = snap.data();
        if (data?.settings) setS(data.settings);
        if (data?.logs) setLogs(data.logs);
        setReady(true);
      },
      () => setReady(true) // 오프라인 등 에러 시 로컬 캐시로 계속 진행
    );
    return () => unsub();
  }, []);

  const save = (ns, nl) => {
    if (ns) setS(ns);
    if (nl) setLogs(nl);
    const payload = {};
    if (ns) payload.settings = ns;
    if (nl) payload.logs = nl;
    docRef.set(payload, { merge: true }).catch(() => {});
    try {
      if (ns) localStorage.setItem("pl:settings", JSON.stringify(ns));
      if (nl) localStorage.setItem("pl:logs", JSON.stringify(nl));
    } catch (e) {}
  };

  /* 사이클 위치 */
  const now = new Date();
  const start = new Date(S.startDate + "T00:00:00");
  const dayDiff = Math.floor((now - start) / 86400000);
  const cycle = Math.max(1, Math.floor(dayDiff / 28) + 1);
  const week = Math.min(4, Math.max(1, Math.floor((((dayDiff % 28) + 28) % 28) / 7) + 1));
  const dow = ["일", "월", "화", "수", "목", "금", "토"][now.getDay()];
  const wk = viewWeek ?? week;

  // 이번 사이클 디로딩(4주차) 스킵 — 시작일을 앞당겨 오늘을 다음 사이클 1주차로 이동
  const skipDeload = () => {
    if (!window.confirm("이번 사이클 디로딩(4주차)을 스킵하고 다음 사이클 1주차로 넘어갈까요?")) return;
    const daysToNextCycle = 28 - (((dayDiff % 28) + 28) % 28);
    const newStart = new Date(start);
    newStart.setDate(newStart.getDate() - daysToNextCycle);
    save({ ...S, startDate: toDateStr(newStart) });
  };

  /* e1RM(3대) — 3주차 진짜 싱글 실측이 사이클 간 기준점 갱신 */
  const E1 = useMemo(() => {
    const out = {};
    for (const k of MAIN_LIFTS) out[k] = currentE1rm(k, S, logs, cycle);
    return out;
  }, [S, cycle, logs]);

  /* 중딥·중량풀업 현재 작업무게 (구 TM 체계 사용자는 1회 자동 이관) */
  const dipPullWeight = (key) => legacyWorkingWeight(S.lifts[key], S.lifts[key].unit || "kg");

  /* 목표/예측 탭용 kg 환산 통합 맵 (딥=lb→kg 환산, 풀업=kg 그대로) */
  const E1ALL = useMemo(() => {
    const out = { ...E1 };
    const dW = dipPullWeight("중딥");
    out["중딥"] = dW != null ? Math.round((dW / KG2LB) * 10) / 10 : null;
    out["중량 풀업"] = dipPullWeight("중량 풀업");
    return out;
  }, [E1, S, cycle, logs]);

  /* 주차별 세션 구성 — RPE+렙 이중 웨이브, 월~금 구조는 4주차(디로드)도 동일(웨이브 표만 가벼워짐) */
  const weekPlan = (w) => {
    const acc = (name, kg, rep, sets, unit, add) => ({ name, logName: name, acc: true, sets, unit: unit || "kg", detail: [{ pct: "", kg, rep, add: add || 0 }] });
    const wave = (table, lift, name, setCount) => {
      const s = waveSet(table, lift, w, E1[lift]);
      const single = table === MAIN_WAVE && w === 3 ? " (진짜 싱글)" : "";
      const repStr = `${s.rep}${single} @RPE${s.rpe}`;
      return {
        name, logName: name, sets: `${setCount}세트`,
        detail: Array.from({ length: setCount }, () => ({ pct: s.pctLabel, kg: s.kg, rep: repStr })),
      };
    };
    const main = (lift) => wave(MAIN_WAVE, lift, lift, 1); // 메인=진짜 싱글로 수렴하는 탑 1세트
    const variation = (baseLift, name) => wave(VAR_WAVE, baseLift, name, 3); // 변형=같은 %·RPE로 3세트 반복(볼륨 담당)
    const straight4x5 = (key) => {
      const unit = S.lifts[key].unit || "kg";
      const wgt = dipPullWeight(key);
      return {
        name: liftLabel(key), logName: key, acc: true, sets: "4×5 @RPE8", unit,
        progressKey: w === 4 ? null : key, progressUnit: unit,
        detail: [0, 1, 2, 3].map(() => ({ pct: "", kg: wgt, rep: "5" })),
      };
    };

    return [
      { day: "월", items: [variation("스쿼트", "볼륨 스쿼트"), variation("벤치", "라슨 벤치"), straight4x5("중딥"), acc("로우", null, "8~12", "4세트"), acc("Core", null, "30~60초", "3세트")] },
      { day: "화", items: [variation("벤치", "템포 벤치"), variation("데드", "정지 데드"), straight4x5("중량 풀업"), acc("사이드델트", null, "15~20", "4세트"), acc("바이셉스", null, "8~12", "4세트")] },
      {
        day: "수",
        items: [
          { name: "순서 고정: 스쿼트→벤치 · 사이 휴식 5분 이상", note: true },
          main("스쿼트"),
          main("벤치"),
          acc("Chest ISO", null, "12~15", "3세트"),
        ],
      },
      { day: "목", items: [acc("슈러그", null, "10~15", "4세트"), acc("리스트컬", null, "15~20", "3세트"), acc("리버스 리스트컬", null, "15~20", "3세트"), acc("트라이셉스", null, "12~15", "4세트"), acc("바이셉스", null, "8~12", "4세트")] },
      { day: "금", items: [main("데드"), variation("벤치", "클로즈그립 벤치"), acc("정지 딥스", null, "6~8", "3세트"), acc("상단 하프 친업", null, "6~10", "3세트"), acc("리어델트", null, "15~20", "4세트")] },
    ];
  };

  const plan = useMemo(() => weekPlan(wk), [wk, S, cycle, logs]);
  const todayItems = plan.find((d) => d.day === dow);
  const pc = PLATE[wk];

  if (!ready)
    return <div style={{ background: "#141519", minHeight: "100vh", color: "#8B909A", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "system-ui, sans-serif" }}>불러오는 중…</div>;

  return (
    <div style={{ background: "#141519", minHeight: "100vh", color: "#ECEDEF", fontFamily: "system-ui, -apple-system, 'Malgun Gothic', sans-serif", paddingBottom: 76 }}>
      <style>{`
        *{box-sizing:border-box} input,select{outline:none}
        input:focus,select:focus{border-color:#D8A62A !important}
        ::placeholder{color:#4E525C}
      `}</style>

      {/* 헤더 */}
      <div style={{ padding: "18px 18px 10px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <div style={{ fontSize: 11, letterSpacing: 3, color: "#8B909A", fontWeight: 500 }}>4주 사이클 프로그램</div>
          <div style={{ fontFamily: "system-ui, -apple-system, sans-serif", fontSize: 26, fontWeight: 700, letterSpacing: 0.5 }}>
            {cycle}<span style={{ fontSize: 15, color: "#8B909A", fontWeight: 500 }}>사이클</span>{" "}
            <span style={{ color: pcColor(week) }}>{week}</span><span style={{ fontSize: 15, color: "#8B909A", fontWeight: 500 }}>주차</span>
          </div>
          {week === 4 && (
            <button onClick={skipDeload} style={{ marginTop: 6, background: "none", border: "1px solid #6E7480", borderRadius: 8, color: "#8B909A", padding: "5px 10px", fontFamily: "inherit", fontSize: 11.5, cursor: "pointer" }}>
              디로딩 스킵 → 다음 사이클
            </button>
          )}
        </div>
        {/* 원판 주차 표시 (시그니처) */}
        <div style={{ display: "flex", gap: 5 }}>
          {[1, 2, 3, 4].map((w) => (
            <div key={w} onClick={() => { setViewWeek(w); setTab("cycle"); }}
              style={{ width: 26, height: 26, borderRadius: "50%", background: PLATE[w].c, opacity: w === week ? 1 : 0.28, border: "3px solid #141519", boxShadow: w === week ? `0 0 0 2px ${PLATE[w].c}` : "none", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "system-ui, -apple-system, sans-serif", fontSize: 11, fontWeight: 700, color: "#141519", cursor: "pointer" }}>
              {w}
            </div>
          ))}
        </div>
      </div>

      {tab === "today" && <Today dow={dow} items={todayItems} week={week} logs={logs} save={save} S={S} cycle={cycle} weekPlan={weekPlan} />}
      {tab === "cycle" && <Cycle plan={plan} wk={wk} setViewWeek={setViewWeek} />}
      {tab === "log" && <LogTab logs={logs} save={save} cycle={cycle} week={week} S={S} />}
      {tab === "set" && <Settings S={S} save={save} E1={E1} E1ALL={E1ALL} dipPullWeight={dipPullWeight} />}
      {tab === "proj" && <Projection S={S} E1={E1} E1ALL={E1ALL} cycle={cycle} week={week} />}

      {/* 하단 탭 */}
      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "#1B1D22", borderTop: "1px solid #2A2D34", display: "flex", zIndex: 50 }}>
        {[["today", "오늘"], ["cycle", "사이클"], ["log", "기록"], ["proj", "예측"], ["set", "설정"]].map(([k, l]) => (
          <button key={k} onClick={() => { setTab(k); if (k === "cycle") setViewWeek(null); }}
            style={{ flex: 1, padding: "13px 0 15px", background: "none", border: "none", color: tab === k ? "#ECEDEF" : "#5B5F69", fontWeight: tab === k ? 700 : 500, fontSize: 13, fontFamily: "inherit", borderTop: tab === k ? "2px solid #D8A62A" : "2px solid transparent", cursor: "pointer" }}>
            {l}
          </button>
        ))}
      </div>
    </div>
  );
}

const pcColor = (w) => PLATE[w].c;

/* ───────── 오늘 탭 ───────── */
function Today({ dow, items, week, logs, save, S, cycle, weekPlan }) {
  const rest = !items;
  const todayStr = toDateStr(new Date());
  const [selDate, setSelDate] = useState(todayStr);
  const isToday = selDate === todayStr;

  // 이번 사이클 28일(1~4주차) 전체를 스크롤로 노출 — 지난 세션 수정 + 앞으로의 루틴(4주차까지) 미리보기
  const cycleStart = new Date(S.startDate + "T00:00:00");
  cycleStart.setDate(cycleStart.getDate() + (cycle - 1) * 28);
  const dateList = Array.from({ length: 28 }, (_, i) => {
    const d = new Date(cycleStart);
    d.setDate(d.getDate() + i);
    return d;
  });
  const WD = ["일", "월", "화", "수", "목", "금", "토"];
  const logsByDate = (ds) => logs.filter((l) => l.date === ds);
  const todayBtnRef = React.useRef(null);
  useEffect(() => {
    todayBtnRef.current?.scrollIntoView({ inline: "center", block: "nearest" });
  }, []);

  // 선택 날짜(과거)의 예정 루틴 역산 — 같은 사이클/주차 로직으로 계산
  const selPlanned = (() => {
    if (isToday) return null;
    const d = new Date(selDate + "T00:00:00");
    const start = new Date(S.startDate + "T00:00:00");
    const dayDiff = Math.floor((d - start) / 86400000);
    if (dayDiff < 0) return { none: true };
    const dCycle = Math.floor(dayDiff / 28) + 1;
    const dWeek = Math.min(4, Math.floor((((dayDiff % 28) + 28) % 28) / 7) + 1);
    const dDow = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
    const dPlan = weekPlan(dWeek);
    const dItems = dPlan.find((x) => x.day === dDow);
    return { cycle: dCycle, week: dWeek, items: dItems, dDow };
  })();

  return (
    <div style={{ padding: "6px 16px" }}>
      <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 8, marginBottom: 4, WebkitOverflowScrolling: "touch" }}>
        {[1, 2, 3, 4].map((w) => (
          <div key={w} style={{
            flexShrink: 0, display: "flex", flexDirection: "column", gap: 5,
            background: "#1B1D22", border: `1px solid ${w === week ? PLATE[w].c + "55" : "#26292F"}`, borderRadius: 12, padding: "7px 8px",
          }}>
            <div style={{ fontSize: 9.5, letterSpacing: 1, color: w === week ? PLATE[w].c : "#5B5F69", fontWeight: 700, paddingLeft: 2 }}>
              {w}주 {PLATE[w].label}
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              {dateList.slice((w - 1) * 7, w * 7).map((d) => {
                const ds = toDateStr(d);
                const has = logsByDate(ds).length > 0;
                const sel = ds === selDate;
                const today = ds === todayStr;
                return (
                  <button key={ds} ref={today ? todayBtnRef : null} onClick={() => setSelDate(ds)}
                    style={{
                      flexShrink: 0, width: 40, padding: "6px 0 5px", borderRadius: 10, border: today && !sel ? "1px solid #D8A62A" : "1px solid transparent",
                      background: sel ? "#D8A62A" : "#141519", color: sel ? "#141519" : "#ECEDEF", fontFamily: "inherit", cursor: "pointer",
                      display: "flex", flexDirection: "column", alignItems: "center", gap: 2,
                    }}>
                    <span style={{ fontSize: 9.5, color: sel ? "#141519" : "#6E7480" }}>{WD[d.getDay()]}</span>
                    <span style={{ fontSize: 14, fontWeight: 700, fontFamily: "system-ui, -apple-system, sans-serif" }}>{d.getDate()}</span>
                    <span style={{ width: 4, height: 4, borderRadius: "50%", background: has ? (sel ? "#141519" : "#4CAF7D") : "transparent" }} />
                  </button>
                );
              })}
            </div>
          </div>
        ))}
      </div>

      <DayExport logs={logsByDate(selDate)} date={selDate} />

      {isToday ? (
        <>
          <SectionLabel text={`${dow}요일 세션 — ${PLATE[week].label} 주`} color={pcColor(week)} />
          {rest ? (
            <Card><div style={{ color: "#8B909A", padding: "8px 0", textAlign: "center" }}>오늘은 휴식일. 주말 근무 회복에 집중하세요.</div></Card>
          ) : (
            [...items.items].sort((a, b) => (hasWeightInput(b) ? 1 : 0) - (hasWeightInput(a) ? 1 : 0))
              .map((it, i) => <TodayCard key={i} it={it} logs={logs} save={save} week={week} cycle={cycle} date={todayStr} S={S} autoSingle />)
          )}
          {!rest && (
            <div style={{ fontSize: 12, color: "#6E7480", lineHeight: 1.7, padding: "10px 4px" }}>
              · RPE가 애매하면 항상 높은 쪽으로 기록 (스티킹 구간 속도가 안 끊기면 8, 찰나라도 멈칫하면 8.5)<br />
              · 세트 옆 체크를 누르면 기록 탭에 바로 등록됩니다
            </div>
          )}
        </>
      ) : (
        <>
          <SectionLabel text={`${selDate} 계획 · 기록`} color={selPlanned?.week ? pcColor(selPlanned.week) : "#8B909A"} />
          {selPlanned?.none ? (
            <Card><div style={{ color: "#8B909A", padding: "8px 0", textAlign: "center" }}>시작일 이전이에요.</div></Card>
          ) : !selPlanned?.items ? (
            <Card><div style={{ color: "#8B909A", padding: "8px 0", textAlign: "center" }}>이 날은 휴식일이었어요.</div></Card>
          ) : (
            <>
              {selPlanned.cycle !== cycle && (
                <div style={{ fontSize: 11, color: "#6E7480", marginBottom: 8 }}>· {selPlanned.cycle}사이클 {selPlanned.week}주차 — 참고: 무게는 현재 e1RM 기준으로 역산돼 당시와 다를 수 있어요</div>
              )}
              {[...selPlanned.items.items].sort((a, b) => (hasWeightInput(b) ? 1 : 0) - (hasWeightInput(a) ? 1 : 0)).map((it, i) => (
                <TodayCard key={i} it={it} logs={logs} save={save} week={selPlanned.week} cycle={selPlanned.cycle} date={selDate} S={S} autoSingle={selPlanned.cycle === cycle} />
              ))}
            </>
          )}

          {logsByDate(selDate).length > 0 && (
            <div style={{ fontSize: 11.5, color: "#6E7480", padding: "4px 4px 10px" }}>
              · 계획에 없는 기록은 기록 탭에서 삭제할 수 있어요
            </div>
          )}

          <button onClick={() => setSelDate(todayStr)} style={{ marginTop: 4, background: "none", border: "1px solid #2A2D34", borderRadius: 8, color: "#8B909A", padding: "8px 14px", fontFamily: "inherit", fontSize: 12.5, cursor: "pointer" }}>
            오늘로 돌아가기
          </button>
        </>
      )}
    </div>
  );
}

/* 선택 날짜 하루치 기록만 내보내기 (AI 채팅 붙여넣기용) */
function DayExport({ logs, date }) {
  const [open, setOpen] = useState(false);
  const [copied, setCopied] = useState(false);
  // 무게 없는(맨몸) 보조운동은 기록 자체가 안 남으므로 방어적으로만 거름
  const withWeight = logs.filter((l) => typeof l.w === "number" && !isNaN(l.w));
  if (withWeight.length === 0) return null;
  const text = withWeight
    .map((l) => `${liftLabel(l.lift)} ${fmt(l.w)}kg×${l.reps}${l.rpe !== "" && l.rpe != null ? ` @${l.rpe}` : ""}${l.memo ? ` (${l.memo})` : ""}`)
    .join("\n");
  const copy = async () => {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {
      setOpen(true);
    }
  };
  return (
    <div style={{ marginTop: 14 }}>
      <SectionLabel text={`${date} 기록 내보내기`} color="#4CAF7D" />
      <Card>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={copy} style={{ flex: 1, background: copied ? "#4CAF7D" : "#D8A62A", color: "#141519", border: "none", borderRadius: 8, padding: "9px 0", fontWeight: 700, fontFamily: "inherit", fontSize: 13, cursor: "pointer" }}>
            {copied ? "복사됨 ✓" : "이 날 기록 복사"}
          </button>
          <button onClick={() => setOpen((v) => !v)} style={{ background: "none", border: "1px solid #2A2D34", borderRadius: 8, color: "#8B909A", padding: "9px 14px", fontFamily: "inherit", fontSize: 12.5, cursor: "pointer" }}>
            {open ? "숨기기" : "텍스트 보기"}
          </button>
        </div>
        {open && (
          <textarea readOnly value={text} onFocus={(e) => e.target.select()}
            style={{ marginTop: 8, width: "100%", height: 100, background: "#141519", border: "1px solid #2A2D34", borderRadius: 8, color: "#ECEDEF", padding: 10, fontSize: 11.5, fontFamily: "monospace", resize: "vertical", boxSizing: "border-box" }} />
        )}
      </Card>
    </div>
  );
}

/* 오늘 탭 전용 — 세트별 실제 수행 입력 + 즉시 기록 */
function TodayCard({ it, logs, save, week, cycle, date, S, autoSingle }) {
  const [inputs, setInputs] = useState({});
  const [entryUnit, setEntryUnit] = useState(it.unit || "kg"); // 입력 단위(kg/lb) — 계획 표시 단위와 별개로 토글 가능

  if (!it.detail) {
    return <Card><div style={{ fontWeight: 700, fontSize: 14 }}>{it.name}</div></Card>;
  }

  // 자체 선택 무게(목표 kg 없음) 보조운동은 이름·세트·횟수만 간단히 표시
  const isSimple = it.detail.every((d) => typeof d.kg !== "number");
  if (isSimple) {
    const rep = withCount(it.detail[0]?.rep || "");
    return (
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontWeight: 700, fontSize: 14.5 }}>{it.name}</div>
          <div style={{ fontSize: 13, color: "#8B909A" }}>{it.sets} · {rep}</div>
        </div>
      </Card>
    );
  }

  const targetDate = date || toDateStr(new Date());
  const liftName = it.logName || it.name;
  // 저장 여부·값은 로컬 세션 기억이 아니라 실제 저장된 logs에서 매번 다시 읽음 (날짜 전환·리마운트에도 안전)
  const matchedLogs = logs.filter((l) => l.lift === liftName && l.cyc === String(cycle) && l.wk === `${week}주` && l.date === targetDate);
  // setIdx로 세트를 못박아 매칭 — 다른 세트가 삭제돼도 자리가 밀리지 않음 (레거시 기록엔 setIdx 없어 위치 매칭으로 폴백)
  const hasTagged = matchedLogs.some((l) => l.setIdx !== undefined);
  const savedFor = (idx) => (hasTagged ? matchedLogs.find((l) => l.setIdx === idx) : matchedLogs[idx]);

  const setF = (idx, field, val) => setInputs((p) => ({ ...p, [idx]: { ...p[idx], [field]: val } }));

  const unit = it.unit || "kg"; // 계획(목표) 표시 기준 단위 — 종목 고정값
  // 계획 총중량(kg) — lb 베이스 + kg 애드온(마이크로 원판) 합산
  const plannedKg = (s) => {
    if (typeof s.kg !== "number") return null;
    const base = unit === "lb" ? s.kg / KG2LB : s.kg;
    return Math.round((base + (s.add || 0)) * 10) / 10;
  };
  // 입력칸 placeholder(입력 단위 기준 — entryUnit 토글로 kg/lb 교차 입력) — 저장된 값이 있으면 그 값, 없으면 계획값
  const displayFor = (idx, s, field) => {
    const saved = savedFor(idx);
    if (!saved) return field === "w" ? plannedDisplayW(s) : "";
    if (field === "w") return entryUnit === "lb" ? String(Math.round(saved.w * KG2LB)) : fmt(saved.w);
    if (field === "reps") return String(saved.reps);
    if (field === "rpe") return saved.rpe === "" || saved.rpe == null ? "" : String(saved.rpe);
  };
  const plannedDisplayW = (s) => {
    const kg = plannedKg(s);
    if (kg == null) return entryUnit === "lb" ? "lb" : "kg";
    return entryUnit === "lb" ? String(Math.round(kg * KG2LB)) : fmt(kg);
  };

  const logSet = (idx, s) => {
    const v = inputs[idx] || {};
    const existing = savedFor(idx);
    const hasInput = v.w !== undefined && v.w !== "";
    const wKg = hasInput ? (entryUnit === "lb" ? Math.round((Number(v.w) / KG2LB) * 10) / 10 : Number(v.w)) : existing ? existing.w : plannedKg(s);
    const reps = v.reps !== undefined && v.reps !== "" ? Number(v.reps) : existing ? existing.reps : null;
    if (!wKg || !reps) return;
    const rpe = v.rpe !== undefined ? (v.rpe === "" ? "" : Number(v.rpe)) : existing ? existing.rpe : "";
    const entry = { id: existing?.id || Date.now() + idx, date: targetDate, cyc: String(cycle), wk: `${week}주`, lift: liftName, w: wKg, reps, rpe, memo: s.pct ? `${s.pct} 세트` : "", setIdx: idx };
    const nl = existing ? logs.map((l) => (l.id === existing.id ? entry : l)) : [...logs, entry];
    if (autoSingle && it.progressKey && idx === it.detail.length - 1 && S) {
      const inc = progressionInc(rpe, it.progressUnit);
      const cur = S.lifts[it.progressKey];
      const curWeight = cur.weight != null && cur.weight !== "" ? Number(cur.weight) : legacyWorkingWeight(cur, it.progressUnit);
      const base = curWeight != null ? curWeight : it.progressUnit === "lb" ? Math.round(wKg * KG2LB) : wKg;
      const ns = { ...S, lifts: { ...S.lifts, [it.progressKey]: { ...cur, weight: base + inc } } };
      save(ns, nl);
    } else {
      save(null, nl);
    }
    setInputs((p) => ({ ...p, [idx]: {} })); // 입력칸 비우기 — 이후 표시는 저장된 값 기준으로
  };

  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
        <div style={{ fontWeight: 700, fontSize: 15.5 }}>{it.name}</div>
        {it.sets && <div style={{ fontSize: 11.5, color: "#8B909A" }}>{it.sets}</div>}
      </div>
      {it.detail.map((s, idx) => {
        const existing = savedFor(idx);
        const isDone = !!existing;
        const v = inputs[idx] || {};
        return (
          <div key={idx} style={{ background: "#141519", borderRadius: 10, padding: "9px 10px", marginBottom: idx < it.detail.length - 1 ? 8 : 0, border: isDone ? "1px solid #4CAF7D" : "1px solid #26292F" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <div style={{ fontSize: 11.5, color: "#8B909A" }}>
                {s.pct ? `${s.pct} · ` : ""}계획 <b style={{ color: "#ECEDEF" }}>{typeof s.kg === "string" ? s.kg : fmt(s.kg)}{typeof s.kg === "number" && it.unit === "lb" ? "lb" : ""}{s.add ? ` +${fmt(s.add)}kg` : ""}</b> × {withCount(s.rep)}
              </div>
            </div>
            <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <input type="number" inputMode="decimal" placeholder={displayFor(idx, s, "w")}
                value={v.w ?? ""} onChange={(e) => setF(idx, "w", e.target.value)} style={{ ...miniInput, flex: 1.1 }} />
              <button type="button" onClick={() => setEntryUnit((u) => (u === "lb" ? "kg" : "lb"))}
                style={{ background: "#22252B", border: "1px solid #2A2D34", borderRadius: 6, color: "#8B909A", padding: "4px 7px", fontFamily: "inherit", fontSize: 11, fontWeight: 700, cursor: "pointer", flexShrink: 0 }}>
                {entryUnit}
              </button>
              <span style={{ color: "#4E525C", fontSize: 12 }}>×</span>
              <input type="number" inputMode="numeric" placeholder={displayFor(idx, s, "reps") || "렙"} value={v.reps ?? ""} onChange={(e) => setF(idx, "reps", e.target.value)} style={{ ...miniInput, flex: 0.7 }} />
              <input type="number" inputMode="decimal" placeholder={displayFor(idx, s, "rpe") || "RPE"} value={v.rpe ?? ""} onChange={(e) => setF(idx, "rpe", e.target.value)} style={{ ...miniInput, flex: 0.8 }} />
              <button onClick={() => logSet(idx, s)}
                style={{ width: 34, height: 34, flexShrink: 0, borderRadius: 8, border: "none", background: isDone ? "#4CAF7D" : "#D8A62A", color: "#141519", fontWeight: 700, fontSize: 15, cursor: "pointer" }}>
                {isDone ? "✓" : "＋"}
              </button>
            </div>
          </div>
        );
      })}
    </Card>
  );
}
const miniInput = { minWidth: 0, background: "#1B1D22", border: "1px solid #2A2D34", borderRadius: 7, color: "#ECEDEF", padding: "7px 6px", fontSize: 13, fontFamily: "inherit", textAlign: "center" };

/* ───────── 사이클 탭 ───────── */
function Cycle({ plan, wk, setViewWeek }) {
  return (
    <div style={{ padding: "6px 16px" }}>
      <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
        {[1, 2, 3, 4].map((w) => (
          <button key={w} onClick={() => setViewWeek(w)}
            style={{ flex: 1, padding: "8px 0", borderRadius: 8, border: `1px solid ${wk === w ? PLATE[w].c : "#2A2D34"}`, background: wk === w ? PLATE[w].c + "22" : "transparent", color: wk === w ? "#ECEDEF" : "#6E7480", fontFamily: "inherit", fontSize: 12.5, fontWeight: wk === w ? 700 : 500, cursor: "pointer" }}>
            {w}주 {PLATE[w].label}
          </button>
        ))}
      </div>

      {plan.map((d, i) => (
        <div key={i} style={{ marginBottom: 14 }}>
          <SectionLabel text={d.day + "요일"} color={pcColor(wk)} />
          {d.items.map((it, j) => (it.note ? <Card key={j}><div style={{ color: "#8B909A" }}>{it.name}</div></Card> : <ExerciseCard key={j} it={it} />))}
        </div>
      ))}

      <div style={{ fontSize: 12, color: "#6E7480", lineHeight: 1.8, padding: "4px 4px 16px" }}>
        · 렙 상한(작업 세트만): 스쿼트 8 / 벤치 6 / 데드 4 — 웨이브 렙이 상한을 넘으면 상한으로 캡하고 같은 RPE로 %e1RM 재계산(화면 % 그대로 반영됨)<br />
        · 메인 3주차 = 진짜 싱글. 이 실측(무게×1@RPE)이 다음 사이클 e1RM 기준점 — 처방보다 여유 있었으면 자동으로 위로, 딱 맞았으면 자연히 유지<br />
        · 중딥·중량풀업 4×5: 4번째(마지막) 세트 RPE로 판정 — ≤6.5 +5kg(딥+10lb) / 7~7.5 +2.5kg(딥+5lb) / 8 +1.25kg(딥+2.5lb) / 8.5~9 유지 / 9.5+ 유지+다음 세션 컨디션 재판단 (4주차 디로드는 증량 판정 없이 수행만)<br />
        · RPE 애매하면 항상 높은 쪽으로. 8=스티킹에서 느려지되 안 끊김, 8.5=찰나라도 멈칫 후 재가속, 9=명확한 그라인드<br />
        · 그립: 볼륨용 당기기(로우·중량풀업 백오프성 볼륨)는 스트랩 허용 / 메인 데드·정지 데드는 맨손 유지
      </div>
    </div>
  );
}

/* ───────── 기록 탭 ───────── */
function LogTab({ logs, save, cycle, week, S }) {
  const todayStr = toDateStr(new Date());
  const del = (id) => save(null, logs.filter((l) => l.id !== id));
  const [showExport, setShowExport] = useState(false);
  const exportText = () =>
    logs
      .map((l) => `${l.date || "-"} · ${l.cyc}사이클 ${l.wk} · ${liftLabel(l.lift)} ${fmt(l.w)}kg × ${l.reps}${l.rpe !== "" && l.rpe != null ? ` @${l.rpe}` : ""}${l.memo ? ` (${l.memo})` : ""}`)
      .join("\n");
  const copyExport = async () => {
    const txt = exportText();
    try {
      await navigator.clipboard.writeText(txt);
    } catch (e) {}
    setShowExport(true);
  };

  return (
    <div style={{ padding: "6px 16px" }}>
      <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 4 }}>
        <button onClick={copyExport} style={{ background: "#1B1D22", border: "1px solid #2A2D34", borderRadius: 8, color: "#8B909A", padding: "6px 12px", fontFamily: "inherit", fontSize: 12, cursor: "pointer" }}>
          전체 기록 복사하기
        </button>
      </div>
      {showExport && (
        <Card>
          <div style={{ fontSize: 11.5, color: "#8B909A", marginBottom: 6 }}>클립보드 복사가 안 되면 아래 텍스트를 길게 눌러 직접 복사하세요.</div>
          <textarea readOnly value={exportText()} onFocus={(e) => e.target.select()}
            style={{ width: "100%", minHeight: 120, background: "#141519", border: "1px solid #2A2D34", borderRadius: 8, color: "#ECEDEF", padding: "8px", fontSize: 11.5, fontFamily: "monospace", resize: "vertical" }} />
        </Card>
      )}
      <SectionLabel text="기록" color="#D8A62A" />
      {(() => {
        const sorted = [...logs].sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.id - a.id);
        const WD = ["일", "월", "화", "수", "목", "금", "토"];
        const dateLabel = (ds) => {
          if (!ds) return "날짜 없음";
          const d = new Date(ds + "T00:00:00");
          return `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})${ds === todayStr ? " · 오늘" : ""}`;
        };
        let lastDate = null;
        return sorted.map((l) => {
          const showHeader = l.date !== lastDate;
          lastDate = l.date;
          return (
            <React.Fragment key={l.id}>
              {showHeader && <SectionLabel text={dateLabel(l.date)} color="#6E7480" />}
              <div style={{ background: "#1B1D22", border: "1px solid #26292F", borderRadius: 10, padding: "10px 12px", marginBottom: 8, display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ fontSize: 10.5, color: "#6E7480", width: 44, flexShrink: 0, lineHeight: 1.4 }}>{l.cyc}사이클<br />{l.wk}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 700 }}>
                    {liftLabel(l.lift)} <span style={{ fontFamily: "system-ui, -apple-system, sans-serif" }}>{fmt(l.w)}</span>kg × {l.reps} {l.rpe !== "" && l.rpe != null ? <span style={{ color: "#8B909A" }}>@{l.rpe}</span> : null}
                  </div>
                  {l.memo ? <div style={{ fontSize: 11.5, color: "#6E7480", marginTop: 2 }}>{l.memo}</div> : null}
                </div>
                <div style={{ textAlign: "right", flexShrink: 0 }}>
                  <div style={{ fontFamily: "system-ui, -apple-system, sans-serif", fontSize: 17, fontWeight: 700, color: "#D8A62A" }}>{fmt(e1rm(l.w, l.reps, l.rpe))}</div>
                  <div style={{ fontSize: 9.5, color: "#6E7480" }}>e1RM</div>
                </div>
                <button onClick={() => del(l.id)} style={{ background: "none", border: "none", color: "#4E525C", fontSize: 16, cursor: "pointer", padding: 4 }}>×</button>
              </div>
            </React.Fragment>
          );
        });
      })()}
    </div>
  );
}

/* ───────── 설정 탭 ───────── */
function Settings({ S, save, E1, E1ALL, dipPullWeight }) {
  // 무게(kg 저장)를 lb로 교차 입력 — 종목별 단위 토글 + 편집 중 임시 원문(draft, 변환 왕복으로 인한 입력값 튐 방지) → blur 시 kg로 환산 저장
  const [units, setUnits] = useState({});
  const [draft, setDraft] = useState({});
  const WEIGHT_FIELDS = ["w", "manual", "inc"];
  const toggleUnit = (k) => setUnits((u) => ({ ...u, [k]: u[k] === "lb" ? "kg" : "lb" }));
  const upd = (k, field, val) => save({ ...S, lifts: { ...S.lifts, [k]: { ...S.lifts[k], [field]: val } } });

  return (
    <div style={{ padding: "6px 16px" }}>
      <SectionLabel text="3대 — e1RM (TM 없음, 직접 % 기준)" color="#D8A62A" />
      {MAIN_LIFTS.map((k) => {
        const v = S.lifts[k];
        return (
        <Card key={k}>
          <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 8, flexWrap: "nowrap", gap: 8 }}>
            <div style={{ fontWeight: 700, fontSize: 14.5, whiteSpace: "nowrap" }}>{k}</div>
            <div style={{ fontSize: 12, color: "#8B909A", whiteSpace: "nowrap" }}>
              e1RM <b style={{ fontFamily: "system-ui, -apple-system, sans-serif", color: "#D8A62A", fontSize: 14 }}>{fmt(E1[k])}</b>
            </div>
          </div>
          <div style={{ fontSize: 11, color: "#6E7480", marginBottom: 8 }}>
            3주차 진짜 싱글 실측 로그가 있으면 그 값(무게×1@RPE)으로 다음 사이클 e1RM 자동 갱신 · 아래 "수동 e1RM"을 채우면 그 값이 항상 우선
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            {[["w", "무게"], ["reps", "횟수"], ["rpe", "RPE"], ["manual", "수동 e1RM"], ["inc", "예측 인상폭"]].map(([f, l]) => {
              const isWeight = WEIGHT_FIELDS.includes(f);
              const fieldUnit = units[k] || "kg";
              const draftKey = `${k}_${f}`;
              const kgVal = v[f];
              const displayVal = draft[draftKey] !== undefined
                ? draft[draftKey]
                : isWeight && fieldUnit === "lb" && kgVal !== "" && kgVal != null && !isNaN(kgVal)
                ? String(Math.round(Number(kgVal) * KG2LB * 10) / 10)
                : kgVal;
              return (
                <div key={f} style={{ flex: 1 }}>
                  <div style={{ fontSize: 10, color: "#6E7480", marginBottom: 3, display: "flex", alignItems: "center", gap: 4 }}>
                    {l}
                    {isWeight && f === "w" && (
                      <button type="button" onClick={() => toggleUnit(k)}
                        style={{ background: "#22252B", border: "1px solid #2A2D34", borderRadius: 4, color: "#8B909A", padding: "1px 4px", fontFamily: "inherit", fontSize: 9, fontWeight: 700, cursor: "pointer" }}>
                        {fieldUnit}
                      </button>
                    )}
                  </div>
                  <input type="number" inputMode="decimal" value={displayVal} placeholder={f === "manual" ? "자동" : ""}
                    onChange={(e) => {
                      if (isWeight && fieldUnit === "lb") setDraft((p) => ({ ...p, [draftKey]: e.target.value }));
                      else upd(k, f, e.target.value);
                    }}
                    onBlur={() => {
                      if (!(isWeight && fieldUnit === "lb")) return;
                      const raw = draft[draftKey];
                      if (raw !== undefined) {
                        upd(k, f, raw === "" ? "" : String(Math.round((Number(raw) / KG2LB) * 100) / 100));
                        setDraft((p) => { const n = { ...p }; delete n[draftKey]; return n; });
                      }
                    }}
                    style={{ ...inputStyle, padding: "8px 6px", fontSize: 13 }} />
                </div>
              );
            })}
          </div>
        </Card>
        );
      })}

      <SectionLabel text="중딥·중량풀업 — 4×5 작업무게" color="#D8A62A" />
      {["중딥", "중량 풀업"].map((k) => {
        const v = S.lifts[k];
        const cur = dipPullWeight(k);
        return (
          <Card key={k}>
            <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 8 }}>
              <div style={{ fontWeight: 700, fontSize: 14.5 }}>{liftLabel(k)}</div>
              <div style={{ fontSize: 12, color: "#8B909A" }}>현재 <b style={{ fontFamily: "system-ui, -apple-system, sans-serif", color: "#D8A62A", fontSize: 14 }}>{fmt(cur)}{v.unit}</b></div>
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 10, color: "#6E7480", marginBottom: 3 }}>작업무게({v.unit})</div>
                <input type="number" inputMode="decimal" value={v.weight ?? ""} placeholder={fmt(cur)}
                  onChange={(e) => upd(k, "weight", e.target.value)}

              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 10, color: "#6E7480", marginBottom: 3 }}>예측 인상폭(kg 환산, 예측 탭 전용)</div>
                <input type="number" inputMode="decimal" value={v.inc ?? ""}
                  onChange={(e) => upd(k, "inc", e.target.value)}
                  style={{ ...inputStyle, padding: "8px 6px", fontSize: 13 }} />
              </div>
            </div>
          </Card>
        );
      })}

      <Card>
        <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 11, color: "#6E7480", marginBottom: 3 }}>1사이클 시작일</div>
            <input type="date" value={S.startDate} onChange={(e) => save({ ...S, startDate: e.target.value })} style={inputStyle} />
          </div>
          <div style={{ flex: 0.6 }}>
            <div style={{ fontSize: 11, color: "#6E7480", marginBottom: 3 }}>체중(kg)</div>
            <input type="number" inputMode="decimal" value={S.bodyweight} onChange={(e) => save({ ...S, bodyweight: e.target.value })} style={inputStyle} />
          </div>
        </div>
        <div>
          <div style={{ fontSize: 11, color: "#6E7480", marginBottom: 3 }}>대회일 (예상)</div>
          <input type="date" value={S.compDate || ""} onChange={(e) => save({ ...S, compDate: e.target.value })} style={inputStyle} />
        </div>
        <div style={{ fontSize: 11.5, color: "#6E7480", marginTop: 8 }}>3대: 매주 처방은 e1RM×%로 직접 산출(TM·AMRAP 없음). e1RM은 3주차 진짜 싱글 실측으로 사이클마다 자동 갱신</div>
        <div style={{ fontSize: 11.5, color: "#6E7480", marginTop: 4 }}>중딥·중량풀업: 4×5 마지막 세트 RPE로 매주 자동 증량(디로드 주는 판정 없이 수행만)</div>
      </Card>

      <SectionLabel text="장기 목표" color="#D8A62A" />
      {Object.entries(GOALS).map(([k, g]) => {
        const cur = E1ALL[k];
        const pct = cur ? Math.min(100, Math.round((cur / g) * 100)) : 0;
        return (
          <div key={k} style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 4 }}>
              <span style={{ fontWeight: 700 }}>{liftLabel(k)} <span style={{ color: "#6E7480", fontWeight: 400 }}>목표 {g}</span></span>
              <span style={{ fontFamily: "system-ui, -apple-system, sans-serif", fontWeight: 700 }}>{fmt(cur)} <span style={{ color: "#8B909A", fontSize: 11, fontWeight: 400 }}>({pct}%)</span></span>

            </div>
            <div style={{ fontSize: 10.5, color: "#4E525C", marginTop: 3 }}>탑 3회 @8 환산: {fmt(r25(g / (1 + 5 / 30)))} kg</div>
          </div>
        );
      })}
      <div style={{ height: 20 }} />
    </div>
  );
}

function Projection({ S, E1, E1ALL, cycle, week }) {
  const items = [
    { key: "스쿼트", color: "#C9463D" },

        · 실측을 갱신할수록(설정 탭) 예측이 정확해집니다 · 인상폭 0인 종목은 도달 시점 계산 불가

/* ───────── 경기 예측 (컴프 3대) ───────── */
function CompPredict({ S, E1, cycle }) {
  const start = new Date(S.startDate + "T00:00:00");
  const comp = new Date(S.compDate + "T00:00:00");
  const now = new Date();
  const daysToComp = Math.round((comp - now) / 86400000);
  const compCycle = Math.max(1, Math.floor((comp - start) / 86400000 / 28) + 1);
  const cyclesLeft = compCycle - cycle;

  const lifts = [
    { key: "스쿼트", color: "#C9463D" },
    { key: "벤치", color: "#3B6FB5" },
    { key: "데드", color: "#D8A62A" },
  ];

  const rows = lifts.map((l) => {
    const e = E1[l.key];
    const inc = Number(S.lifts[l.key]?.inc) || 0;
    const pred = e != null ? Math.max(e, e + inc * cyclesLeft) : null;
    return {
      ...l,
      pred,
      open: pred != null ? r25(pred * 0.91) : null,
      second: pred != null ? r25(pred * 0.96) : null,
      third: pred != null ? r25(pred * 1.01) : null,
    };
  });
  const predTotal = rows.every((r) => r.pred != null) ? rows.reduce((s, r) => s + r.pred, 0) : null;
  const thirdTotal = rows.every((r) => r.third != null) ? rows.reduce((s, r) => s + r.third, 0) : null;

  return (
    <>
      <SectionLabel text="경기 예측" color="#4CAF7D" />
      <Card>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 10 }}>
          <div style={{ fontWeight: 700, fontSize: 14.5 }}>{S.compDate} 기준</div>
          <div style={{ fontSize: 12, color: daysToComp < 0 ? "#6E7480" : "#D8A62A", fontWeight: 700 }}>
            {daysToComp >= 0 ? `D-${daysToComp}` : "경기 종료"}
          </div>
        </div>
        {rows.map((r) => (
          <div key={r.key} style={{ marginBottom: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 4 }}>
              <span style={{ fontWeight: 700 }}>{r.key}</span>
              <span style={{ color: "#8B909A" }}>예상 e1RM <b style={{ fontFamily: "system-ui, -apple-system, sans-serif", color: "#ECEDEF" }}>{fmt(r.pred)}kg</b></span>
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              {[["1차", r.open], ["2차", r.second], ["3차", r.third]].map(([lbl, v], i) => (
                <div key={lbl} style={{ flex: 1, background: "#141519", borderRadius: 8, padding: "7px 4px", textAlign: "center", border: i === 2 ? `1px solid ${r.color}` : "1px solid transparent" }}>
                  <div style={{ fontSize: 9.5, color: "#6E7480" }}>{lbl}</div>
                  <div style={{ fontFamily: "system-ui, -apple-system, sans-serif", fontSize: 16, fontWeight: 700, color: "#ECEDEF" }}>{fmt(v)}</div>
                </div>
              ))}
            </div>
          </div>
        ))}
        <div style={{ borderTop: "1px solid #26292F", marginTop: 4, paddingTop: 8, display: "flex", justifyContent: "space-between", fontSize: 12.5 }}>
          <span style={{ color: "#8B909A" }}>예상 총합(e1RM 합) <b style={{ color: "#ECEDEF" }}>{fmt(predTotal)}kg</b></span>
          <span style={{ color: "#8B909A" }}>3차 목표 합 <b style={{ color: "#4CAF7D" }}>{fmt(thirdTotal)}kg</b></span>
        </div>
      </Card>
      <div style={{ fontSize: 11.5, color: "#6E7480", lineHeight: 1.6, padding: "0 4px 14px" }}>
        · 예상 e1RM = 현재 e1RM + 인상폭×(경기까지 남은 사이클), 피킹 발현 보너스는 미포함(보수적 추정)<br />
        · 시기: 1차 91% / 2차 96% / 3차 101% — 참고용, 실제 컨디션 따라 조정
      </div>
    </>
  );
}

function ProjChart({ label, color, applied, inc, goal, curCycle, curWeek, startDate }) {
  const W = 300, H = 116, PAD = 26;
  const svgRef = React.useRef(null);
  const [hover, setHover] = useState(null);
  if (applied == null || goal == null) return null;
  const incW = inc / 4; // 사이클 인상폭을 4주에 걸쳐 균등 분배(주차별 추정)
  const curAbs = (curCycle - 1) * 4 + curWeek; // 절대 주차(1주=1사이클1주차)
  const reached = applied >= goal;
  const wNeeded = reached ? 0 : incW > 0 ? Math.ceil((goal - applied) / incW) : null;
  const targetAbs = wNeeded == null ? null : curAbs + wNeeded;
  const horizonAbs = targetAbs != null ? targetAbs + 4 : curAbs + 24; // 6사이클치 기본 범위
  const span = Math.max(1, horizonAbs - curAbs);
  const weeksArr = Array.from({ length: span + 1 }, (_, i) => curAbs + i);
  const vals = weeksArr.map((a) => applied + (a - curAbs) * incW);
  const yMin = Math.min(...vals, goal) * 0.96;
  const yMax = Math.max(...vals, goal) * 1.04;
  const range = yMax - yMin || 1;
  const x = (a) => PAD + ((a - curAbs) / span) * (W - PAD * 2);
  const y = (v) => H - PAD + 6 - ((v - yMin) / range) * (H - PAD - 6);
  const pathD = weeksArr.map((a, i) => `${i === 0 ? "M" : "L"} ${x(a).toFixed(1)} ${y(vals[i]).toFixed(1)}`).join(" ");
  const goalY = y(goal);

  const absToCW = (a) => ({ c: Math.floor((a - 1) / 4) + 1, w: ((a - 1) % 4) + 1 });
  const dateOf = (a) => {
    const d = new Date(startDate + "T00:00:00");
    d.setDate(d.getDate() + (a - 1) * 7);
    return `${d.getMonth() + 1}월 ${d.getDate()}일`;
  };

  let targetStr = "";
  if (targetAbs != null) {
    const { c, w } = absToCW(targetAbs);
    targetStr = `${dateOf(targetAbs)}경, ${c}사이클 ${w}주차`;
  }

  const handleMove = (clientX) => {
    const el = svgRef.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    if (!rect.width) return;
    const svgX = ((clientX - rect.left) / rect.width) * W;
    const frac = (svgX - PAD) / (W - PAD * 2);
    let a = Math.round(curAbs + frac * span);
    a = Math.max(curAbs, Math.min(horizonAbs, a));
    const val = applied + (a - curAbs) * incW;
    setHover({ a, x: x(a), y: y(val), val });
  };
  const onTouchMove = (e) => { if (e.touches && e.touches[0]) handleMove(e.touches[0].clientX); };
  const onMouseMove = (e) => handleMove(e.clientX);
  const clearHover = () => setHover(null);

  // 사이클 경계(주차1) 위치에 세로 구분선 + 주차 눈금
  const cycleBoundaries = weeksArr.filter((a) => (a - 1) % 4 === 0);
  const tickStep = Math.max(1, Math.ceil(weeksArr.length / 8));
  const ticks = weeksArr.filter((_, i) => i % tickStep === 0);

  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
        <div style={{ fontWeight: 700, fontSize: 14.5 }}>{label}</div>
        <div style={{ fontSize: 12, color: "#8B909A" }}>목표 <b style={{ color: "#ECEDEF" }}>{fmt(goal)}kg</b> · 현재 <b style={{ color: "#ECEDEF" }}>{fmt(applied)}kg</b></div>
      </div>
      <svg
        ref={svgRef}
        width="100%"
        viewBox={`0 0 ${W} ${H}`}
        style={{ display: "block", touchAction: "none", cursor: "crosshair" }}
        onTouchStart={onTouchMove}
        onTouchMove={onTouchMove}
        onTouchEnd={clearHover}
        onMouseMove={onMouseMove}
        onMouseLeave={clearHover}
      >
        <line x1={PAD} y1={goalY} x2={W - PAD} y2={goalY} stroke="#4CAF7D" strokeDasharray="4 3" strokeWidth="1" />
        {cycleBoundaries.map((a) => (
          <line key={"cb" + a} x1={x(a)} y1={8} x2={x(a)} y2={H - PAD} stroke="#26292F" strokeWidth="1" />
        ))}
        <path d={pathD} fill="none" stroke={color} strokeWidth="2.5" />
        {weeksArr.map((a, i) => (
          <circle key={a} cx={x(a)} cy={y(vals[i])} r={a === curAbs ? 3.5 : (a - 1) % 4 === 0 ? 2.3 : 1.3} fill={a === curAbs ? "#ECEDEF" : color} />
        ))}
        {targetAbs != null && targetAbs <= horizonAbs && <circle cx={x(targetAbs)} cy={goalY} r={4} fill="#4CAF7D" />}
        {ticks.map((a) => {
          const { c, w } = absToCW(a);
          return (
            <text key={a} x={x(a)} y={H - 6} fontSize="7.5" fill="#5B5F69" textAnchor="middle">{c}·{w}주</text>
          );
        })}
      </svg>
      {hover ? (
        <div style={{ fontSize: 12.5, color: "#ECEDEF", marginTop: 4, background: "#141519", borderRadius: 6, padding: "5px 9px", display: "inline-block" }}>
          {dateOf(hover.a)} <span style={{ color: "#6E7480" }}>({absToCW(hover.a).c}사이클 {absToCW(hover.a).w}주차)</span> · <b style={{ color }}>{fmt(hover.val)}kg</b>
        </div>
      ) : reached ? (
        <div style={{ fontSize: 12.5, color: "#4CAF7D", fontWeight: 700, marginTop: 4 }}>이미 목표 도달</div>
      ) : incW > 0 ? (
        <div style={{ fontSize: 12.5, color: "#8B909A", marginTop: 4 }}>
          <b style={{ color: "#ECEDEF" }}>{targetStr}</b> 도달 예상 · <span style={{ color: "#5B5F69" }}>그래프를 눌러보세요</span>
        </div>
      ) : (
        <div style={{ fontSize: 12.5, color: "#D8A62A", marginTop: 4 }}>인상폭 미설정 — 설정 탭에서 사이클당 증량 입력 필요</div>
      )}
    </Card>
  );
}

/* ───────── 공용 컴포넌트 ───────── */
function Card({ children }) {
  return <div style={{ background: "#1B1D22", border: "1px solid #26292F", borderRadius: 12, padding: "13px 14px", marginBottom: 10 }}>{children}</div>;
}
function SectionLabel({ text, color }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, margin: "14px 2px 8px" }}>
      <div style={{ width: 8, height: 8, borderRadius: "50%", background: color }} />
      <div style={{ fontSize: 11.5, letterSpacing: 2, color: "#8B909A", fontWeight: 700 }}>{text}</div>
    </div>
  );
}
function ExerciseCard({ it, big }) {
  return (
    <Card>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: it.detail ? 8 : 0 }}>
        <div style={{ fontWeight: 700, fontSize: big ? 15.5 : 14 }}>{it.name}</div>
        {it.sets && <div style={{ fontSize: 11.5, color: "#8B909A" }}>{it.sets}</div>}
      </div>
      {it.detail && (
        <div style={{ display: "flex", gap: 8 }}>
          {it.detail.map((s, i) => (
            <div key={i} style={{ flex: 1, background: "#141519", borderRadius: 8, padding: "8px 6px", textAlign: "center", border: it.pct === "기입" ? "1px solid #D8A62A" : "1px solid transparent" }}>
              <div style={{ fontSize: 10, color: "#6E7480" }}>{s.pct || "\u00A0"}</div>
              <div style={{ fontFamily: "system-ui, -apple-system, sans-serif", fontSize: big ? 22 : 19, fontWeight: 700, color: "#ECEDEF", lineHeight: 1.2 }}>
                {typeof s.kg === "string" ? s.kg : fmt(s.kg)}
                {typeof s.kg !== "string" && s.kg != null && it.unit === "lb" && (
                  <span style={{ fontSize: 11, fontWeight: 500, color: "#8B909A", marginLeft: 2 }}>lb</span>
                )}
                {s.add ? <span style={{ fontSize: 11, fontWeight: 700, color: "#D8A62A", marginLeft: 3 }}>+{fmt(s.add)}kg</span> : null}
              </div>
              <div style={{ fontSize: 10.5, color: "#8B909A", marginTop: 1 }}>{withCount(s.rep)}</div>
            </div>
          ))}
        </div>
      )}
    </Card>
  );
}
const inputStyle = { width: "100%", background: "#141519", border: "1px solid #2A2D34", borderRadius: 8, color: "#ECEDEF", padding: "9px 10px", fontSize: 13.5, fontFamily: "inherit" };

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
